# Builds the driver app (APK). On main it is published as the "driver-app" release, so the driver can download it from
# https://github.com/<owner>/<repo>/releases/latest. Set the repository variable DRIVER_SERVER_URL (the server's
# https address) to build it in; the secrets DRIVER_KEYSTORE_B64 and DRIVER_KEYSTORE_PASSWORD sign it with the same
# key every time, so updates install over the old app.
name: Driver app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DRIVER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/driver.jks"
            echo "DRIVER_KEYSTORE_FILE=$RUNNER_TEMP/driver.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key set: the APK is signed with a temporary key."
          fi
      - name: Build
        env:
          DRIVER_KEYSTORE_PASSWORD: ${{ secrets.DRIVER_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease -PserverUrl="${{ vars.DRIVER_SERVER_URL }}" -PversionCode=${{ github.run_number }}
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk driver-app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: driver-app
          path: driver-app.apk
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete driver-app --yes --cleanup-tag || true
          gh release create driver-app driver-app.apk --title "Driver app (build ${{ github.run_number }})" --notes "Install on the driver's Android phone. Built from ${{ github.sha }}." --latest
